name: Academy preview checks
on:
  push:
    branches: [preview/academy-dev]
  pull_request:
    branches: [preview/academy-dev]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: python3 -B -m unittest discover -s scripts/import
      - run: npm run build
      - run: npm run typecheck
      - run: node scripts/preview-security-check.mjs
